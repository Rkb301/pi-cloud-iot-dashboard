name: Verify cloud IoT dashboard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MOCK_GPIO: '1'
      ENABLE_MQTT: '0'
      ENABLE_THINGSPEAK: '0'
      ALLOW_MOCK_CLOUD: '0'
      DASHBOARD_TOKEN: 'test-only-token'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python test suite
        run: python -m unittest discover -s tests -v
      - name: Verify dashboard JavaScript
        run: node tests/test_dashboard.js
